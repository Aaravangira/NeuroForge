<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Invoice Extractor</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <span class="navbar-brand fw-bold">

            🤖 AI Invoice Extractor

        </span>

        <span class="badge bg-light text-dark">

            FastAPI + AI

        </span>

    </div>

</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4>

                        Upload Invoice

                    </h4>

                </div>

                <div class="card-body">

                    <form id="uploadForm">

                        <div class="mb-3">

                            <input

                                class="form-control"

                                type="file"

                                id="file"

                                accept=".pdf,.png,.jpg,.jpeg"

                                required>

                        </div>

                        <button

                            class="btn btn-success"

                            type="submit">

                            <i class="bi bi-upload"></i>

                            Upload & Extract

                        </button>

                    </form>

                    <hr>

                    <div

                        id="loading"

                        style="display:none;">

                        <div class="spinner-border text-primary"></div>

                        <span class="ms-2">

                            Processing Invoice...

                        </span>

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-4">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    Dashboard

                </div>

                <div class="card-body">

                    <h5>

                        Total Invoices

                    </h5>

                    <h2 id="invoiceCount">

                        0

                    </h2>

                    <hr>

                    <h5>

                        Total Amount

                    </h5>

                    <h2 id="totalAmount">

                        ₹0

                    </h2>

                </div>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-md-12">

            <div class="card shadow">

                <div class="card-header bg-dark text-white">

                    Extracted Invoice

                </div>

                <div class="card-body">

                    <pre id="result">

Upload a document...

                    </pre>

                </div>

            </div>

        </div>

    </div>
        <div class="row mt-4">

        <div class="col-md-12">

            <div class="card shadow">

                <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">

                    <span>

                        Invoice History

                    </span>

                    <div>

                        <input

                            type="text"

                            id="searchBox"

                            class="form-control"

                            placeholder="Search Invoice..."

                            style="width:250px;display:inline-block;">

                    </div>

                </div>

                <div class="card-body">

                    <div class="mb-3">

                        <button

                            class="btn btn-primary"

                            id="refreshBtn">

                            Refresh

                        </button>

                        <a

                            href="/download-excel"

                            class="btn btn-success">

                            Download Excel

                        </a>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-bordered table-hover">

                            <thead class="table-dark">

                                <tr>

                                    <th>ID</th>

                                    <th>Vendor</th>

                                    <th>Invoice No</th>

                                    <th>Date</th>

                                    <th>Total</th>

                                    <th>Action</th>

                                </tr>

                            </thead>

                            <tbody id="historyTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="mt-5 text-center text-muted mb-3">

    AI Invoice Extractor © 2026

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/static/app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>{% block title %}InvoiceAI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=20260905">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="appSidebar">
        <div class="brand">
            <div class="brand-mark"><i class="bi bi-stars"></i></div>
            <div><span class="brand-name">InvoiceAI</span><span class="brand-subtitle">Intelligence</span></div>
        </div>

        <div class="nav-label">Workspace</div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item {% if request.url.path == '/dashboard' %}active{% endif %}"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
            <a href="/upload-page" class="nav-item {% if request.url.path == '/upload-page' %}active{% endif %}"><i class="bi bi-cloud-arrow-up"></i><span>Process Invoice</span><span class="nav-badge">AI</span></a>
            <a href="/history-page" class="nav-item {% if request.url.path == '/history-page' %}active{% endif %}"><i class="bi bi-receipt"></i><span>Invoices</span></a>
            <a href="/reports" class="nav-item {% if request.url.path == '/reports' %}active{% endif %}"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
        </nav>

        <div class="nav-label nav-label-secondary">Manage</div>
        <nav class="sidebar-nav">
            <a href="/settings" class="nav-item {% if request.url.path == '/settings' %}active{% endif %}"><i class="bi bi-sliders2"></i><span>Settings</span></a>
        </nav>

        <div class="sidebar-footer">
            <div class="ai-status"><span class="status-dot"></span><div><strong>AI Engine</strong><small>Systems operational</small></div></div>
        </div>
    </aside>

    <main class="main-area">
        <header class="topbar">
            <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation"><i class="bi bi-list"></i></button>
            <div class="topbar-title">
                <span class="eyebrow">INVOICE INTELLIGENCE</span>
                <h1>{% block page_title %}Dashboard{% endblock %}</h1>
            </div>
            <div class="topbar-actions">
                <a href="/upload-page" class="topbar-upload"><i class="bi bi-plus-lg"></i><span>New invoice</span></a>
                <button class="icon-button" aria-label="Notifications"><i class="bi bi-bell"></i><span class="notification-dot"></span></button>
                <div class="user-menu"><div class="avatar">AI</div><div class="user-meta"><strong>Admin</strong><span>Workspace</span></div><i class="bi bi-chevron-down"></i></div>
            </div>
        </header>

        <section class="page-content">
            {% block content %}{% endblock %}
        </section>
    </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
    const menu=document.getElementById('mobileMenu'), sidebar=document.getElementById('appSidebar'), overlay=document.getElementById('sidebarOverlay');
    function toggle(){ sidebar.classList.toggle('open'); overlay.classList.toggle('show'); }
    if(menu) menu.addEventListener('click',toggle);
    if(overlay) overlay.addEventListener('click',toggle);
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>

version: "3.9"

services:
  ai_invoice_extractor:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_invoice_extractor

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./output:/app/output

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s